# Conda environment for the BENCHMARK runtime + full verifier (needs torch).
#
# Used by: `python -m benchmark.run_pipeline {fit,predict,metrics,bs,cf,all}`
#   and `python -m benchmark.verify --full` (adds L3 GT-axis + L6 fold-align,
#   which need the torch metric kernels and the heavy uns matrices).
# Versions are pinned to the working `vcell` env (captured 2026-06-16). NOTE:
# numpy is 2.0.1 here (vs 2.2.6 in `preprocess`) — torch 2.5.1 constrains it, so
# the two envs are intentionally separate. Pick the torch build (CPU vs CUDA)
# that matches your hardware; this cluster node is CPU-only.
#
#   conda env create -f environment-vcell.yml            # creates env `vcell`
#   conda run -n vcell python -m benchmark.run_pipeline all --dataset adamson16 ...
name: vcell
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10.19
  - numpy=2.0.1
  - scipy=1.15.3
  - pandas=2.3.3
  - scikit-learn=1.7.2
  - h5py
  - pyarrow
  - requests
  - pytest
  - pip
  - pip:
      - torch==2.5.1
      - anndata==0.11.4
      - scanpy==1.11.5   # exact build was not cleanly resolvable in the live env
      - gseapy
      - decoupler
